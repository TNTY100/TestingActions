# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    tags: [ "v**" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  changelog:
    if: startsWith(github.ref, 'refs/tags/v')
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    env:
      TEMP_LOG_FILE: "dist/changelog.md"
      LOG_FILE: "docs/changelog.md"
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged pull requests
        uses: VanOns/get-merged-pull-requests-action@v1
        id: pull_requests
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create temp changelog file
        env:
          PULL_REQUESTS_FILE: ${{ steps.pull_requests.outputs.pull_requests_file }}
        run: |
          LAST_VERSION=$(git tag --sort=-creatordate | sed -n '2p')
          FOLDER=$(dirname $TEMP_LOG_FILE)
          if [ ! -d "$FOLDER" ]; then
            mkdir "$FOLDER"
          fi
          echo "## ${CURRENT_VERSION} — $(date +%F)" > $TEMP_LOG_FILE
          if [ -z "$PULL_REQUESTS_FILE" ] || [ ! -f "$PULL_REQUESTS_FILE" ]; then
            echo "No change via Pull Request. Change log should be done manually." >> $TEMP_LOG_FILE
            exit 0
          fi
          
          titles=$(jq -r '.[] | "- " + .title + " (Pr: #" + (.number | tostring) + " by @" + .user.login + ")"' "$PULL_REQUESTS_FILE"| sort | uniq)
          
          if [ -z "$titles" ]; then
            echo "No change via Pull Request. Change log should be done manually." >> $TEMP_LOG_FILE
          else
            
            echo "$titles" | while read -r title; do
              echo "$title" >> $TEMP_LOG_FILE
            done
          fi
          echo -e "\n\n**Full Changelog**: https://github.com/Houssame-EA/IsotopeTrack/compare/${LAST_VERSION}...${CURRENT_VERSION}" >> $TEMP_LOG_FILE

          cat $TEMP_LOG_FILE
      
      - name: Use temp changelog file 
        run: |
          echo $LOG_FILE
          FOLDER=$(dirname $LOG_FILE)
          if [ ! -d $FOLDER ]; then
            mkdir $FOLDER
          fi

          if [ ! -e $LOG_FILE ]; then
            echo -e "# Changelog\n\nAll notable changes to IsotopeTrack are documented here.\n\n---\n" > $LOG_FILE
          fi
          
          sed -i -e "6{r $TEMP_LOG_FILE" -e "; N}" $LOG_FILE

          git config user.name "Github Action"
          git config user.email "<>"

          git add $LOG_FILE
          git commit -m "Added change log"
          git push
  
